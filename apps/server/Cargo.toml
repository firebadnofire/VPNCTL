[package]
name = "vam-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
bundled-helper = ["reqwest/native-tls-vendored"]

[dependencies]
reqwest.workspace = true
url.workspace = true
vam-dns = { path = "../../crates/dns" }
async-trait.workspace = true
chrono.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
vam-authority = { path = "../../crates/authority" }
vam-application = { path = "../../crates/application" }
vam-core = { path = "../../crates/core" }
vam-protocol = { path = "../../crates/protocol" }
vam-secrets = { path = "../../crates/secrets" }
vam-storage = { path = "../../crates/storage" }
vam-ssh = { path = "../../crates/ssh" }
tokio-util.workspace = true
zeroize.workspace = true
x509-parser.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["dir"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
tempfile.workspace = true
vam-backend-openvpn = { path = "../../crates/backend-openvpn" }
vam-backend-ikev2 = { path = "../../crates/backend-ikev2" }

[lints]
workspace = true
