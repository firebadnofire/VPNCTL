name: Release Packaging

'on':
  push:
    tags:
      - 'v*'

env:
  RELEASE_BODY: |
    Automated release assets for VPN Appliance Manager.

    Assets:
    - macOS app: `vpn-appliance-manager-macos-app.zip`
    - Linux AppImage: `vpn-appliance-manager-linux-x86_64.AppImage`
    - Linux deb: `vpn-appliance-manager-linux-x86_64.deb`

    Windows note:
    Windows packaging is intentionally not automated here yet because the current
    release path uses MSVC, WebView2, NASM, and NSIS on a Windows host. Build it
    manually with `build-helpers/windows/build.ps1` until a Windows-native
    Forgejo runner is available.

jobs:
  package:
    name: Package ${{ matrix.package.name }}
    if: ${{ startsWith(forgejo.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ matrix.package.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: macOS
            runs_on: macos-latest
            build_shell: bash
            required_tools: base64 cargo curl ditto git jq node pnpm rustc rustup
            prepare_checkout_command: |
              set -euo pipefail

              for tool in base64 git; do
                if ! command -v "$tool" >/dev/null 2>&1; then
                  echo "Missing required checkout tool: ${tool}. Install Xcode Command Line Tools or provide ${tool} on the macOS runner PATH." >&2
                  exit 1
                fi
              done
            setup_command: |
              set -euo pipefail

              for path_entry in "${HOME}/.local/bin" "${HOME}/.cargo/bin" /opt/homebrew/bin /usr/local/bin; do
                if [ -d "$path_entry" ]; then
                  export PATH="${path_entry}:${PATH}"
                  echo "$path_entry" >> "${GITHUB_PATH:-/tmp/github_path}"
                fi
              done

              if ! command -v curl >/dev/null 2>&1; then
                echo "Missing required macOS build tool: curl" >&2
                exit 1
              fi

              if ! command -v jq >/dev/null 2>&1; then
                if command -v brew >/dev/null 2>&1; then
                  brew install jq
                else
                  echo "Missing required macOS build tool: jq. Install jq or provide Homebrew on the runner PATH." >&2
                  exit 1
                fi
              fi

              node_version="v24.18.0"
              if ! command -v node >/dev/null 2>&1 || [ "$(node --version)" != "$node_version" ]; then
                node_arch="$(uname -m)"
                case "$node_arch" in
                  arm64) node_arch="arm64" ;;
                  x86_64) node_arch="x64" ;;
                  *)
                    echo "Unsupported macOS Node architecture: ${node_arch}" >&2
                    exit 1
                    ;;
                esac

                node_dir="${HOME}/.local/node-${node_version}"
                node_archive="${RUNNER_TEMP:-/tmp}/node-${node_version}-darwin-${node_arch}.tar.gz"
                rm -rf "$node_dir"
                mkdir -p "$node_dir"
                curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
                  "https://nodejs.org/dist/${node_version}/node-${node_version}-darwin-${node_arch}.tar.gz" \
                  --output "$node_archive"
                tar -xzf "$node_archive" --strip-components=1 -C "$node_dir"
                export PATH="${node_dir}/bin:${PATH}"
                echo "${node_dir}/bin" >> "${GITHUB_PATH:-/tmp/github_path}"
              fi

              if ! command -v rustup >/dev/null 2>&1; then
                curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs \
                  | sh -s -- -y --profile minimal --default-toolchain 1.97.1
                export PATH="${HOME}/.cargo/bin:${PATH}"
                echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH:-/tmp/github_path}"
              fi

              rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
              rustup default 1.97.1

              corepack_dir="${HOME}/.local/bin"
              mkdir -p "$corepack_dir"
              corepack enable pnpm --install-directory "$corepack_dir"
              corepack install --global pnpm@11.9.0

              if [ "$(node --version)" != "v24.18.0" ]; then
                echo "Node v24.18.0 is required; found $(node --version)" >&2
                exit 1
              fi

              if [ "$(pnpm --version)" != "11.9.0" ]; then
                echo "pnpm 11.9.0 is required; found $(pnpm --version)" >&2
                exit 1
              fi
            build_command: |
              set -euo pipefail

              ./build-helpers/mac/build.sh

              app_bundle="target/release/bundle/macos/VPN Appliance Manager.app"
              if [ ! -d "$app_bundle" ]; then
                echo "macOS build did not produce ${app_bundle}." >&2
                exit 1
              fi

              mkdir -p dist/releases
              rm -f dist/releases/vpn-appliance-manager-macos-app.zip
              ditto -c -k --sequesterRsrc --keepParent "$app_bundle" dist/releases/vpn-appliance-manager-macos-app.zip
            artifact_paths: dist/releases/vpn-appliance-manager-macos-app.zip

          - name: Linux
            runs_on: ubuntu-latest
            build_shell: bash
            required_tools: base64 cargo curl file git jq node pnpm rustc rustup
            prepare_checkout_command: |
              set -euo pipefail

              missing_tools=""
              for tool in base64 curl git jq; do
                if ! command -v "$tool" >/dev/null 2>&1; then
                  missing_tools="${missing_tools} ${tool}"
                fi
              done

              if [ -n "$missing_tools" ]; then
                apt_get="apt-get"
                if command -v sudo >/dev/null 2>&1; then
                  apt_get="sudo apt-get"
                fi
                $apt_get update
                $apt_get install -y --no-install-recommends ca-certificates coreutils curl git jq
              fi

              for tool in base64 curl git jq; do
                if ! command -v "$tool" >/dev/null 2>&1; then
                  echo "Missing required checkout tool after bootstrap: ${tool}" >&2
                  exit 1
                fi
              done
            setup_command: |
              set -euo pipefail

              apt_get="apt-get"
              if command -v sudo >/dev/null 2>&1; then
                apt_get="sudo apt-get"
              fi

              export DEBIAN_FRONTEND=noninteractive
              $apt_get update
              $apt_get install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                coreutils \
                curl \
                file \
                git \
                jq \
                libayatana-appindicator3-dev \
                libssl-dev \
                librsvg2-dev \
                libwebkit2gtk-4.1-dev \
                libxdo-dev \
                patchelf \
                pkg-config \
                tar \
                wget

              export HOME="${HOME:-/root}"
              export CARGO_HOME="${CARGO_HOME:-${HOME}/.cargo}"
              export RUSTUP_HOME="${RUSTUP_HOME:-${HOME}/.rustup}"
              export PATH="${CARGO_HOME}/bin:${HOME}/.local/bin:${PATH}"
              echo "${CARGO_HOME}/bin" >> "${GITHUB_PATH:-/tmp/github_path}"
              echo "${HOME}/.local/bin" >> "${GITHUB_PATH:-/tmp/github_path}"

              node_version="v24.18.0"
              node_dir="${HOME}/.local/node-${node_version}"
              if ! command -v node >/dev/null 2>&1 || [ "$(node --version)" != "$node_version" ]; then
                node_arch="$(uname -m)"
                case "$node_arch" in
                  x86_64) node_arch="x64" ;;
                  aarch64) node_arch="arm64" ;;
                  *)
                    echo "Unsupported Linux Node architecture: ${node_arch}" >&2
                    exit 1
                    ;;
                esac

                node_archive="${RUNNER_TEMP:-/tmp}/node-${node_version}-linux-${node_arch}.tar.gz"
                rm -rf "$node_dir"
                mkdir -p "$node_dir"
                curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
                  "https://nodejs.org/dist/${node_version}/node-${node_version}-linux-${node_arch}.tar.gz" \
                  --output "$node_archive"
                tar -xzf "$node_archive" --strip-components=1 -C "$node_dir"
              fi

              export PATH="${node_dir}/bin:${PATH}"
              echo "${node_dir}/bin" >> "${GITHUB_PATH:-/tmp/github_path}"

              if ! command -v rustup >/dev/null 2>&1; then
                curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs \
                  | sh -s -- -y --no-modify-path --profile minimal --default-toolchain 1.97.1
              fi

              rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
              rustup default 1.97.1

              corepack enable pnpm --install-directory "${HOME}/.local/bin"
              corepack install --global pnpm@11.9.0

              if [ "$(node --version)" != "v24.18.0" ]; then
                echo "Node v24.18.0 is required; found $(node --version)" >&2
                exit 1
              fi

              if [ "$(pnpm --version)" != "11.9.0" ]; then
                echo "pnpm 11.9.0 is required; found $(pnpm --version)" >&2
                exit 1
              fi

              if [ "$(rustc --version | awk '{print $2}')" != "1.97.1" ]; then
                echo "Rust 1.97.1 is required; found $(rustc --version)" >&2
                exit 1
              fi
            build_command: |
              set -euo pipefail

              export HOME="${HOME:-/root}"
              export CARGO_HOME="${CARGO_HOME:-${HOME}/.cargo}"
              export PATH="${CARGO_HOME}/bin:${HOME}/.local/node-v24.18.0/bin:${HOME}/.local/bin:${PATH}"
              export CI=true

              pnpm install --frozen-lockfile
              pnpm verify
              pnpm --dir apps/desktop tauri build --bundles deb,appimage --ci

              linux_appimage="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | sort | head -n 1)"
              if [ -z "$linux_appimage" ] || [ ! -f "$linux_appimage" ]; then
                echo "Linux build did not produce an AppImage under target/release/bundle/appimage." >&2
                exit 1
              fi

              linux_deb="$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' | sort | head -n 1)"
              if [ -z "$linux_deb" ] || [ ! -f "$linux_deb" ]; then
                echo "Linux build did not produce a deb under target/release/bundle/deb." >&2
                exit 1
              fi

              mkdir -p dist/releases
              rm -f dist/releases/vpn-appliance-manager-linux-x86_64.AppImage
              rm -f dist/releases/vpn-appliance-manager-linux-x86_64.deb
              install -m 0755 "$linux_appimage" dist/releases/vpn-appliance-manager-linux-x86_64.AppImage
              install -m 0644 "$linux_deb" dist/releases/vpn-appliance-manager-linux-x86_64.deb
            artifact_paths: dist/releases/vpn-appliance-manager-linux-x86_64.AppImage dist/releases/vpn-appliance-manager-linux-x86_64.deb

    steps:
      - name: Prepare checkout runtime
        shell: ${{ matrix.package.build_shell }}
        run: |
          ${{ matrix.package.prepare_checkout_command }}

      - name: Check out repository
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -euo pipefail

          for tool in base64 git; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "Missing required checkout tool: ${tool}" >&2
              exit 1
            fi
          done

          server_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:-}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:-}}"
          ref="${FORGEJO_REF:-${GITHUB_REF:-}}"
          sha="${FORGEJO_SHA:-${GITHUB_SHA:-}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"

          if [ -z "$server_url" ]; then
            echo "Missing Forgejo server URL." >&2
            exit 1
          fi

          if [ -z "$repository" ]; then
            echo "Missing repository name." >&2
            exit 1
          fi

          case "$server_url" in
            https://*) ;;
            *)
              echo "Repository server URL must use https: ${server_url}" >&2
              exit 1
              ;;
          esac

          remote_url="${server_url%/}/${repository}.git"
          git init .
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "$remote_url"

          git_fetch() {
            if [ -n "$token" ]; then
              auth_header="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"
              git -c "http.${remote_url}.extraheader=AUTHORIZATION: basic ${auth_header}" "$@"
            else
              git "$@"
            fi
          }

          if [ -n "$ref" ]; then
            git_fetch fetch --force --tags --prune --depth=1 origin "+${ref}:${ref}"
            git checkout --force --detach "$ref"
          elif [ -n "$sha" ]; then
            git_fetch fetch --force --tags --prune --depth=1 origin "$sha"
            git checkout --force --detach "$sha"
          else
            echo "Missing both ref and sha for checkout." >&2
            exit 1
          fi

          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - name: Run environment setup
        if: ${{ matrix.package.setup_command != '' }}
        shell: ${{ matrix.package.build_shell }}
        run: ${{ matrix.package.setup_command }}

      - name: Validate packaging inputs
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ matrix.package.artifact_paths }}
          BUILD_COMMAND: ${{ matrix.package.build_command }}
          REQUIRED_TOOLS: ${{ matrix.package.required_tools }}
        run: |
          set -euo pipefail

          if [ -z "${BUILD_COMMAND:-}" ]; then
            echo "Missing matrix build_command for ${RUNNER_OS:-unknown runner OS}." >&2
            exit 1
          fi

          if [ -z "${ARTIFACT_PATHS:-}" ]; then
            echo "Missing matrix artifact_paths for ${RUNNER_OS:-unknown runner OS}." >&2
            exit 1
          fi

          for path_entry in "${HOME}/.local/bin" "${HOME}/.cargo/bin" /opt/homebrew/bin /usr/local/bin; do
            if [ -d "$path_entry" ]; then
              export PATH="${path_entry}:${PATH}"
            fi
          done

          for tool in $REQUIRED_TOOLS; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "Missing required tool: ${tool}" >&2
              exit 1
            fi
          done

      - name: Run build
        shell: ${{ matrix.package.build_shell }}
        run: ${{ matrix.package.build_command }}

      - name: Validate release artifact
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ matrix.package.artifact_paths }}
        run: |
          set -euo pipefail

          for artifact_path in $ARTIFACT_PATHS; do
            if [ ! -f "$artifact_path" ]; then
              echo "Release artifact does not exist or is not a file: ${artifact_path}" >&2
              exit 1
            fi

            if [ ! -s "$artifact_path" ]; then
              echo "Release artifact is empty: ${artifact_path}" >&2
              exit 1
            fi
          done

      - name: Publish Forgejo release
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ matrix.package.artifact_paths }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
          INPUT_RELEASE_BODY: ${{ env.RELEASE_BODY }}
        run: |
          set -euo pipefail

          api_url="${FORGEJO_API_URL:-${GITHUB_API_URL:?Missing Forgejo API URL}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:?Missing repository name}}"
          tag="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:-}}"
          if [ -z "$tag" ]; then
            tag="${FORGEJO_REF:-${GITHUB_REF:-}}"
            tag="${tag#refs/tags/}"
          fi
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:?Missing Forgejo token}}"
          owner="${repository%%/*}"
          repo="${repository#*/}"
          asset_paths="${ARTIFACT_PATHS:?Missing artifact paths}"
          release_name="VPN Appliance Manager ${tag}"
          release_body="${INPUT_RELEASE_BODY:-Automated release for ${tag}.}"

          case "$api_url" in
            https://*) ;;
            *)
              echo "Forgejo API URL must use https: ${api_url}" >&2
              exit 1
              ;;
          esac

          if [ -z "$tag" ]; then
            echo "Missing release tag. Run this workflow on a tag ref." >&2
            exit 1
          fi

          release_payload="$(jq -n \
            --arg tag "$tag" \
            --arg name "$release_name" \
            --arg body "$release_body" \
            '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false, hide_archive_links: false}')"

          api_request() {
            local method="$1"
            local url="$2"
            shift 2
            curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
              --request "$method" \
              --header "Authorization: token ${token}" \
              "$@" \
              "$url"
          }

          fetch_release_by_tag() {
            local response_file
            local status

            response_file="$(mktemp)"
            status="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --header "Authorization: token ${token}" \
              "${api_url}/repos/${owner}/${repo}/releases/tags/${tag}")"

            if [ "$status" = "200" ]; then
              cat "$response_file"
              return 0
            fi

            if [ "$status" = "404" ]; then
              return 1
            fi

            cat "$response_file" >&2
            echo "Failed to look up release for ${tag}: HTTP ${status}" >&2
            exit 1
          }

          create_release() {
            local response_file
            local status

            response_file="$(mktemp)"
            status="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: token ${token}" \
              --header "Content-Type: application/json" \
              --data "$release_payload" \
              "${api_url}/repos/${owner}/${repo}/releases")"

            if [ "$status" = "200" ] || [ "$status" = "201" ]; then
              cat "$response_file"
              return 0
            fi

            if [ "$status" = "409" ] || [ "$status" = "422" ]; then
              if release_json="$(fetch_release_by_tag)"; then
                printf '%s' "$release_json"
                return 0
              fi
            fi

            cat "$response_file" >&2
            echo "Failed to create release for ${tag}: HTTP ${status}" >&2
            exit 1
          }

          if release_json="$(fetch_release_by_tag)"; then
            release_id="$(printf '%s' "$release_json" | jq -r '.id')"
            release_json="$(api_request PATCH "${api_url}/repos/${owner}/${repo}/releases/${release_id}" \
              --header "Content-Type: application/json" \
              --data "$release_payload")"
          else
            release_json="$(create_release)"
          fi

          release_id="$(printf '%s' "$release_json" | jq -r '.id')"
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "Release response did not include an id." >&2
            exit 1
          fi

          for asset_path in $asset_paths; do
            if [ ! -f "$asset_path" ]; then
              echo "Release asset does not exist or is not a file: ${asset_path}" >&2
              exit 1
            fi

            asset_name="$(basename "$asset_path")"
            asset_name_encoded="$(jq -nr --arg value "$asset_name" '$value|@uri')"
            existing_asset_id="$(api_request GET "${api_url}/repos/${owner}/${repo}/releases/${release_id}/assets" \
              | jq -r --arg name "$asset_name" '.[] | select(.name == $name) | .id' \
              | head -n 1)"

            if [ -n "$existing_asset_id" ]; then
              api_request DELETE "${api_url}/repos/${owner}/${repo}/releases/${release_id}/assets/${existing_asset_id}" >/dev/null
            fi

            api_request POST "${api_url}/repos/${owner}/${repo}/releases/${release_id}/assets?name=${asset_name_encoded}" \
              --form "attachment=@${asset_path}" >/dev/null
          done
